- file: 4_term_검색.png
  title: zsh, example app
  text: '# SQL injection candidates

    $ rg -n -t php ''(->query|mysqli_query|mysql_query|sql_query)\s*\(.*\$'' .

    ./bbs/view.php:4:$row = sql_query("select * from g5_write_free where wr_id = ''$wr_id''");

    # Command execution functions

    $ rg -n -t php ''\b(system|exec|shell_exec|passthru|popen|proc_open|pcntl_exec)\s*\('' .

    ./adm/tool.php:2:system(''ping -c 1 '' . $_POST[''host'']);

    # include with a variable path

    $ rg -n -t php ''(include|require)(_once)?\s*\(?\s*\$'' .

    ./bbs/download.php:4:include($_GET[''skin''] . ''/list.skin.php'');

    '
