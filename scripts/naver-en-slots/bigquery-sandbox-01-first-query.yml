- file: 6_term_DML.png
  text: "# Create a table from query results\n$ bq query --use_legacy_sql=false \\\n  \"CREATE TABLE bq_lab.top_names AS\n   SELECT name, gender, SUM(number) total\n   FROM \\`bigquery-public-data.usa_names.usa_1910_current\\\
    `\n   WHERE year>=2000 GROUP BY name, gender\"\nCreated bq-sandbox-blog.bq_lab.top_names\n# Update a row\n$ bq query --use_legacy_sql=false \\\n  \"UPDATE bq_lab.top_names SET total = 0 WHERE name =\
    \ 'Jacob'\"\nBigQuery error in query operation: Error processing job 'bq-sandbox-\nblog:bqjob_r70b1757d2a772841_000001a15c8ce56a_1': Billing has not been enabled\nfor this project. Enable billing at\
    \ https://console.cloud.google.com/billing.\nDML queries are not allowed in the free tier. Set up a billing account to remove\nthis restriction.\n"
- file: 7_items_정리.png
  en:
    items:
    - - LIMIT doesn't cut bytes
      - Still 194.9 MB with LIMIT, 100.2 MB only after dropping columns
    - - Estimate before running
      - Status line under the console editor, or --dry_run in the CLI
    - - Cache needs identical text
      - Rerun cost 0 bytes, a changed line break read it again
    - - No DML
      - UPDATE and INSERT rejected, rebuild with CREATE TABLE AS SELECT
    - - 10 GiB is a lifetime cap
      - Deleting data doesn't refund it, tables expire after 60 days
